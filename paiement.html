<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - NDéré</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url("aire.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 0;
        }

        /* HEADER - EFFET GLASS */
        header {
            position: relative;
            z-index: 10;
            padding: 8px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35), 0 2px 10px rgba(0, 0, 0, 0.2);
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);
            width: 100%;
            flex-shrink: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .logo-container i { margin-right: 8px; }

        .auth-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Message de bienvenue */
        .welcome-message {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .welcome-message .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #1a73e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: white;
        }

        .welcome-message span {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-deconnexion {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .btn-deconnexion:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- CONTENU PRINCIPAL --- */
        .content-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px 40px;
            gap: 40px;
            flex-wrap: wrap;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* DIV BLANC AU MILIEU (comme le formulaire de recherche) */
        .paiement-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .paiement-container h2 {
            text-align: center;
            color: #1a73e8;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .paiement-container h2 span {
            color: #202124;
        }

        /* Récapitulatif */
        .recap-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .recap-summary .item {
            flex: 1;
            min-width: 120px;
        }

        .recap-summary .item .label {
            font-size: 0.7rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }

        .recap-summary .item .value {
            font-weight: 600;
            color: #202124;
            font-size: 0.95rem;
        }

        .recap-summary .item .value i {
            margin-right: 5px;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #5f6368;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: #1a73e8;
        }

        .form-group select {
            background: white;
            cursor: pointer;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 140px;
        }

        .btn-payer {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-payer:hover {
            background: #1557b0;
        }

        .form-message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .form-message.success {
            background: rgba(52, 168, 83, 0.2);
            color: #34a853;
            border: 1px solid rgba(52, 168, 83, 0.3);
        }

        .form-message.error {
            background: rgba(217, 48, 37, 0.2);
            color: #d93025;
            border: 1px solid rgba(217, 48, 37, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .back-link:hover {
            color: #1a73e8;
        }

        /* Champs cachés par défaut */
        .champs-carte, .champs-mobile {
            display: none;
        }

        .champs-carte.visible, .champs-mobile.visible {
            display: block;
        }

        /* Notification SMS */
        .sms-notification {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(26, 115, 232, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            font-weight: 600;
            text-align: center;
            max-width: 90%;
            display: none;
            animation: fadeInDown 0.5s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 8px 15px; }
            .content-wrapper { 
                flex-direction: column; 
                padding: 15px; 
                gap: 20px;
                height: auto;
                overflow-y: auto;
            }
            html, body { overflow-y: auto; }
            .paiement-container { padding: 20px; }
            .recap-summary .item { min-width: 100%; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <section class="hero">
        
        <!-- HEADER -->
        <header>
            <div class="logo-container">
                <i class="fas fa-paper-plane"></i>
                <span>NDéré</span>
            </div>
            <div class="auth-buttons" id="auth-buttons">
                <!-- Rempli par JavaScript -->
            </div>
        </header>

        <!-- CONTENU PRINCIPAL -->
        <div class="content-wrapper">
            
            <!-- DIV BLANC AU MILIEU -->
            <div class="paiement-container" id="paiement-container">
                <h2>💳 <span>Paiement</span></h2>
                <div id="recap-content">Chargement...</div>
            </div>

        </div>

    </section>

    <!-- Notification SMS -->
    <div id="sms_notification" class="sms-notification">
        <i class="fas fa-check-circle"></i> 
        <span id="sms_message">Paiement confirmé !</span>
    </div>

    <script>
        // ===================== RÉCUPÉRATION DES DONNÉES =====================
        
        // Récupérer les données de la réservation depuis le localStorage
        const reservationData = JSON.parse(localStorage.getItem('ndere_reservation') || '{}');

        // Remplir le récapitulatif
        function renderRecap() {
            const container = document.getElementById('recap-content');
            if (!reservationData.depart_id) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px; color:#888;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem; margin-bottom:15px;"></i>
                        <h3>Aucune réservation trouvée</h3>
                        <p>Veuillez effectuer une réservation d'abord.</p>
                        <a href="index.html" style="display:inline-block; margin-top:15px; padding:10px 25px; background:#1a73e8; color:white; text-decoration:none; border-radius:8px; font-weight:600;">
                            Retour à l'accueil
                        </a>
                    </div>
                `;
                return;
            }

            const icone = reservationData.transport === 'avion' ? 'plane' : (reservationData.transport === 'train' ? 'train' : 'bus');
            const total = (reservationData.prix || 0) * (reservationData.nombre_places || 1);

            container.innerHTML = `
                <div class="recap-summary">
                    <div class="item">
                        <div class="label">Transport</div>
                        <div class="value">
                            <i class="fas fa-${icone}"></i>
                            ${reservationData.transport ? reservationData.transport.charAt(0).toUpperCase() + reservationData.transport.slice(1) : '-'}
                        </div>
                    </div>
                    <div class="item">
                        <div class="label">Départ</div>
                        <div class="value">${reservationData.depart || '-'}</div>
                    </div>
                    <div class="item">
                        <div class="label">Destination</div>
                        <div class="value">${reservationData.destination || '-'}</div>
                    </div>
                    <div class="item">
                        <div class="label">Date</div>
                        <div class="value">${reservationData.date || '-'}</div>
                    </div>
                    <div class="item">
                        <div class="label">Nombre de places</div>
                        <div class="value">${reservationData.nombre_places || 1}</div>
                    </div>
                    <div class="item">
                        <div class="label">Montant total</div>
                        <div class="value" style="color:#1a73e8; font-weight:700; font-size:1.2rem;">
                            ${total.toFixed(2)} xaf
                        </div>
                    </div>
                </div>

                <form id="paiementForm">
                    <div class="form-group">
                        <label>Mode de paiement</label>
                        <select id="mode_paiement" required onchange="changerModePaiement()">
                            <option value="">Sélectionnez un mode</option>
                            <option value="carte">Carte bancaire</option>
                            <option value="om">Orange Money (OM)</option>
                            <option value="mtn">MTN Mobile Money (MNT)</option>
                        </select>
                    </div>

                    <!-- Champs pour Carte Bancaire -->
                    <div id="champs_carte" class="champs-carte">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Numéro de carte</label>
                                <input type="text" placeholder="1234 5678 9012 3456">
                            </div>
                            <div class="form-group">
                                <label>Date d'expiration</label>
                                <input type="text" placeholder="MM/AA">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>CVV</label>
                                <input type="text" placeholder="123">
                            </div>
                            <div class="form-group">
                                <label>Nom sur la carte</label>
                                <input type="text" placeholder="Nom du titulaire">
                            </div>
                        </div>
                    </div>

                    <!-- Champs pour OM / MTN -->
                    <div id="champs_mobile" class="champs-mobile">
                        <div class="form-group">
                            <label>Numéro de compte</label>
                            <input type="text" placeholder="Numéro de téléphone">
                        </div>
                        <div class="form-group">
                            <label>Nom du compte</label>
                            <input type="text" placeholder="Nom du titulaire">
                        </div>
                        <div class="form-group">
                            <label>Mot de passe</label>
                            <input type="password" placeholder="Mot de passe">
                        </div>
                    </div>

                    <button type="button" class="btn-payer" onclick="effectuerPaiement()">
                        <i class="fas fa-credit-card"></i> Payer maintenant
                    </button>
                </form>

                <a href="reservation.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Retour à la réservation
                </a>
            `;
        }

        // ===================== GESTION DU MODE DE PAIEMENT =====================
        
        let modePaiementActuel = '';

        function changerModePaiement() {
            const mode = document.getElementById('mode_paiement').value;
            const champsCarte = document.getElementById('champs_carte');
            const champsMobile = document.getElementById('champs_mobile');
            
            champsCarte.classList.remove('visible');
            champsMobile.classList.remove('visible');
            
            if (mode === 'carte') {
                champsCarte.classList.add('visible');
                modePaiementActuel = 'Carte bancaire';
            } else if (mode === 'om') {
                champsMobile.classList.add('visible');
                modePaiementActuel = 'Orange Money (OM)';
            } else if (mode === 'mtn') {
                champsMobile.classList.add('visible');
                modePaiementActuel = 'MTN Mobile Money (MNT)';
            }
        }

        // ===================== PAIEMENT =====================
        
        function effectuerPaiement() {
            const mode = document.getElementById('mode_paiement').value;
            if (!mode) {
                alert('Veuillez sélectionner un mode de paiement');
                return;
            }

            let nomCompte = '';
            let montant = (reservationData.prix || 0) * (reservationData.nombre_places || 1);
            
            if (mode === 'carte') {
                nomCompte = document.querySelector('#champs_carte input:last-child').value || 'Titulaire de la carte';
            } else {
                nomCompte = document.querySelector('#champs_mobile input:nth-child(2)').value || 'Titulaire du compte';
            }

            const sms = document.getElementById('sms_notification');
            const smsMessage = document.getElementById('sms_message');
            
            let modeNom = '';
            if (mode === 'carte') modeNom = 'Carte bancaire';
            else if (mode === 'om') modeNom = 'Orange Money (OM)';
            else if (mode === 'mtn') modeNom = 'MTN Mobile Money (MNT)';
            
            smsMessage.innerHTML = `
                <strong>Paiement confirmé !</strong><br>
                Mode: ${modeNom}<br>
                Compte: ${nomCompte}<br>
                Montant: ${montant.toFixed(2)} xaf
            `;
            sms.style.display = 'block';

            // Stocker les données du billet
            const billetData = {
                code: 'ND-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + new Date().toISOString().slice(0,10).replace(/-/g, ''),
                transport: reservationData.transport || '-',
                depart: reservationData.depart || '-',
                destination: reservationData.destination || '-',
                'date-depart': reservationData.date || '-',
                'date-arrivee': reservationData.date || '-',
                duree: reservationData.duree || '-',
                distance: reservationData.distance || '-',
                nom: reservationData.nom || '-',
                email: reservationData.email || '-',
                telephone: reservationData.telephone || '-',
                classe: reservationData.classe || '-',
                'nombre-places': reservationData.nombre_places || 1,
                'mode-paiement': modeNom,
                montant: montant.toFixed(2) + ' xaf'
            };
            localStorage.setItem('ndere_billet', JSON.stringify(billetData));

            // Redirection après 4 secondes
            setTimeout(() => {
                sms.style.opacity = '0';
                setTimeout(() => {
                    sms.style.display = 'none';
                    sms.style.opacity = '1';
                    window.location.href = 'billet.html';
                }, 500);
            }, 4000);
        }

        // ===================== GESTION DE L'AUTHENTIFICATION =====================
        
        function checkAuth() {
            const user = localStorage.getItem('ndere_user');
            const authButtons = document.getElementById('auth-buttons');
            if (user) {
                const userData = JSON.parse(user);
                authButtons.innerHTML = `
                    <div class="welcome-message">
                        <div class="user-avatar">${userData.nom.charAt(0).toUpperCase()}</div>
                        <span>Bienvenue, ${userData.nom}</span>
                        <a href="deconnexion.html" class="btn-deconnexion">Déconnexion</a>
                    </div>
                `;
            } else {
                authButtons.innerHTML = `
                    <a href="connexion.html" class="btn btn-outline">Se connecter</a>
                    <a href="connexion.html" class="btn btn-primary">S'inscrire</a>
                `;
            }
        }

        // ===================== INITIALISATION =====================
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            renderRecap();
        });
    </script>

</body>
</html>
